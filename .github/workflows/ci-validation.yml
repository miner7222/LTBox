name: CI and packaging validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.21
        with:
          tool: shellcheck@0.11.0
      - name: Install actionlint from its official release
        # install-action does not support this actionlint version.
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check
          tool_dir="${RUNNER_TEMP}/actionlint-bin"
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" -C "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -version
          echo "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Validate workflows and embedded shell
        # actionlint 1.7.12 predates the documented concurrency.queue field.
        # Keep this exception specific; all other schema checks remain enabled.
        run: actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Validate packaging shell scripts
        run: shellcheck packaging/linux/*.sh misc/macos/make-app.sh
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Test packaging policies and manifest rendering
        run: python3 -m unittest discover -s packaging -v

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install repository metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm
      - name: Test signed repository with disposable fixtures
        run: bash packaging/linux/test_repository.sh
