name: External download contracts

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: external-download-contracts
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  LTBOX_GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-root-tests:
    name: Build root download contract once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -D warnings
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: ltbox-v1
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: ./.github/actions/cargo-sources
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sccache-setup
      - name: Build and verify the test executable
        run: |
          cargo test -p ltbox-patch --lib --locked --no-run --message-format=json > root-test-build.json
          python3 ci/stage_root_test.py root-test-build.json root-test/root-contract-tests
      - uses: actions/upload-artifact@v7
        with:
          name: root-contract-tests
          path: root-test/
          if-no-files-found: error
          retention-days: 1

      - name: Report compiler cache diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sccache-report
        with:
          artifact-name: sccache-${{ github.job }}-${{ strategy.job-index || '0' }}

  root:
    needs: build-root-tests
    name: Root / ${{ matrix.provider }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [Magisk, KernelSU, KernelSUNext, SukiSU, ReSukiSU, APatch, FolkPatch, Skroot]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: root-contract-tests
          path: root-test
      - run: chmod +x root-test/root-contract-tests
      - name: Fetch and unpack stable and available nightly payloads
        env:
          LTBOX_CHECK_PROVIDER: ${{ matrix.provider }}
        run: |
          set -o pipefail
          ./root-test/root-contract-tests --exact root_pipeline::root_target_tests::weekly_fetch_root_providers --ignored --nocapture 2>&1 | tee download-check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: download-root-${{ matrix.provider }}
          path: download-check.log
          retention-days: 30

  other-downloads:
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -D warnings
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: ltbox-v1
    name: Drivers and application assets / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev
      - run: rustup show
      - uses: ./.github/actions/cargo-sources
        with:
          save: ${{ github.ref == 'refs/heads/main' && runner.os == 'Windows' }}
      - uses: ./.github/actions/sccache-setup
      - name: Fetch drivers without installing
        shell: bash
        run: |
          set -o pipefail
          cargo test -p ltbox-device --locked weekly_fetch -- --ignored --nocapture 2>&1 | tee driver-check.log
      - name: Fetch application and GBL assets without installing
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p ltbox-gui --locked weekly_fetch -- --ignored --nocapture 2>&1 | tee app-check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: download-other-${{ matrix.os }}
          path: '*-check.log'
          retention-days: 30

      - name: Report compiler cache diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sccache-report
        with:
          artifact-name: sccache-${{ github.job }}-${{ strategy.job-index || '0' }}
