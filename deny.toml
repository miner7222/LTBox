# cargo-deny configuration. Run locally with `cargo deny check`; CI gates on it.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `rsa` Marvin timing side-channel (no fixed release yet). LTBox does AVB /
    # key work locally on the user's own machine; the attack needs an attacker
    # observing many timed signing operations, which this offline desktop flow
    # does not expose. Revisit when a fixed `rsa` ships.
    "RUSTSEC-2023-0071", # rsa Marvin timing side channel via adb_client; no fixed 0.9 release
    # Unmaintained transitive crates (no known vulnerability), pulled deep via
    # build/UI dependencies and not used directly. Accepted for now.
    "RUSTSEC-2021-0139", # ansi_term unmaintained
    "RUSTSEC-2024-0375", # atty unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (deep via iced cosmic-text; no upgrade path)
    # `rustybuzz` unmaintained (no fixed release; advisory says "No safe
    # upgrade is available"). Pulled ONLY transitively via iced's SVG path:
    # iced -> iced_renderer -> iced_tiny_skia/iced_wgpu -> resvg -> usvg ->
    # rustybuzz 0.20.1. LTBox does not depend on rustybuzz directly; shaping
    # runs only on trusted GUI SVG/font assets, not untrusted input. Revisit
    # when iced/resvg/usvg migrate off rustybuzz (e.g. to harfrust).
    "RUSTSEC-2026-0206", # rustybuzz unmaintained (transitive via iced/resvg; no upgrade path)
    # zbus 5's helper crates were folded into zbus 6 and are no longer
    # published on their own. They arrive only through zbus 5, used by
    # `dark-light` 3 (system theme) and iced's `mundy` (iced_winit); neither
    # has a zbus 6 release yet, so there is no upgrade path ("No safe upgrade
    # is available"). D-Bus is used only for desktop theme/settings queries.
    # Revisit when dark-light and iced move to zbus 6.
    "RUSTSEC-2026-0370", # zvariant unmaintained (transitive via zbus 5)
    "RUSTSEC-2026-0371", # zbus_names unmaintained (transitive via zbus 5)
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained (transitive via zbus 5)
]

[bans]
# The GUI/platform dependency graph intentionally carries many duplicate
# transitive versions; keep this gate focused on advisories/licenses/sources.
multiple-versions = "allow"
# Workspace path deps and the git deps legitimately carry no version constraint.
wildcards = "allow"

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",       # LTBox itself
    "GPL-2.0-or-later",       # kptools (or-later -> usable as GPL-3.0)
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "NCSA",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

# magiskboot-rs ships a verbatim GPL-3.0 LICENSE file but leaves the Cargo
# `license` field empty, so cargo-deny cannot auto-detect it. Assert it for the
# crate and its `base` / `derive` sub-crates (same git source).
[[licenses.clarify]]
crate = "magiskboot@0.1.2"
expression = "GPL-3.0-or-later"
license-files = []

[[licenses.clarify]]
crate = "base@0.1.2"
expression = "GPL-3.0-or-later"
license-files = []

[[licenses.clarify]]
crate = "derive@0.1.2"
expression = "GPL-3.0-or-later"
license-files = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/miner7222/avbtool-rs",
    "https://github.com/miner7222/magiskboot-rs",
    "https://github.com/miner7222/kptools-rs",
]
